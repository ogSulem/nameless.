[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM"]
ignore = [
    "S101",   # assert in tests
    "S105", "S106",  # test tokens
    "S311",   # no crypto here
    "S110",   # best-effort cleanup around Telegram/Redis
    "S104",   # binding 0.0.0.0 is required inside the container
    "B008",   # aiogram dependency injection
    "B904",
    "SIM105", "SIM117", "SIM102",
    "UP038", "UP041",
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "E402", "F401"]
"scripts/*" = ["T201"]
"app/handlers/*" = ["S106"]

[tool.ruff.format]
quote-style = "double"
